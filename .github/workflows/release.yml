name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Verify release source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo 'Release tag must name a commit on main.' >&2
            exit 1
          }
          state="$(git status --porcelain)"
          test -z "$state" || { echo 'Release checkout must be clean.' >&2; exit 1; }
      - name: Verify release version and prepare notes
        shell: bash
        run: |
          python3 .github/scripts/changelog-check.py --tag "$GITHUB_REF_NAME" --notes "$RUNNER_TEMP/release-notes.md"
      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          options=()
          case "${GITHUB_REF_NAME%%+*}" in *-*) options+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/release-notes.md" "${options[@]}"
